[package]
name = "MangaYouKnow"
version = "0.9.33"
description = "A manga app!"
authors = ["thiagovianav"]
license = "MIT"
repository = "https://github.com/manga-you-know/desktop"
edition = "2021"
rust-version = "1.98.1"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[profile.release]
opt-level = 3
lto = true       
strip = true
codegen-units = 1

[build-dependencies.tauri-build]
version = "3.0.0-alpha.4"
features = []

[dependencies.tauri]
version = "3.0.0-alpha.5"
features = ["protocol-asset", "tray-icon", "image-png", "image-ico"]

[target.'cfg(target_os = "linux")'.dependencies]
tauri-runtime-cef = { version = "3.0.0-alpha.0", features = ["devtools"] }
tauri-plugin-dialog = { version = "3.0.0-alpha.0", default-features = false, features = ["xdg-portal"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-runtime-wry = { version = "3.0.0-alpha.0" }
tauri-plugin-dialog = "3.0.0-alpha.0"

[dependencies]
serde_json = "1.0"
base64 = "0.22"
lazy_static = "1.5.0"
once_cell = "1.20.2"
tauri-plugin-fs = "3.0.0-alpha.0"
tauri-plugin-store = "3.0.0-alpha.0"
tauri-plugin-process = "3.0.0-alpha.0"
tauri-plugin-shell = "3.0.0-alpha.0"
tauri-plugin-os = "3.0.0-alpha.0"
tauri-plugin-opener = "3.0.0-alpha.0"
tauri-plugin-autostart = "3.0.0-alpha.0"
tauri-plugin-cli = "3.0.0-alpha.0"
tauri-plugin-global-shortcut = "3.0.0-alpha.0"
tauri-plugin-single-instance = "3.0.0-alpha.0"
tauri-plugin-window-state = "3.0.0-alpha.0"
tauri-plugin-positioner = "3.0.0-alpha.0"
tauri-plugin-clipboard-manager = "3.0.0-alpha.0"
tauri-plugin-updater = "3.0.0-alpha.0"
# tauri-plugin-prevent-default = "6"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.tauri-plugin-sql]
version = "3.0.0-alpha.0"
features = ["sqlite"]

[dependencies.tauri-plugin-notification]
version = "3.0.0-alpha.0"

[dependencies.tauri-plugin-http]
version = "3.0.0-alpha.0"
features = ["unsafe-headers"]
